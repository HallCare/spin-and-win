<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عجلة الحظ - صالة العناية | Hall Care</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Tajawal:wght@500;800&family=Playfair+Display:ital,wght=1,600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f7e6d4;      /* اللون الكريمي الهادئ للموقع */
            --primary-color: #8c6239; /* البني الداكن المعتمد للخطوط والعجلة */
            --accent-color: #b07d53;  /* البني الفاتح للأزرار والجوائز */
            --light-prize: #d9b48f;   /* اللون التناوبي الفاتح في العجلة */
            --insta-color: #d62976;   /* لون إنستغرام */
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', 'Cairo', sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* تأثير العناصر المتطايرة في الخلفية */
        .floating-icons-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }

        .floating-icon {
            position: absolute;
            font-size: 24px;
            opacity: 0.25;
            animation: floatAnimation 12s linear infinite;
        }

        @keyframes floatAnimation {
            0% { transform: translateY(110vh) rotate(0deg) scale(0.8); opacity: 0; }
            10% { opacity: 0.3; }
            90% { opacity: 0.3; }
            100% { transform: translateY(-10vh) rotate(360deg) scale(1.2); opacity: 0; }
        }

        /* حاوية الصفحات الرئيسية */
        .container {
            text-align: center;
            max-width: 480px;
            width: 90%;
            padding: 30px 20px;
            box-sizing: border-box;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 20px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 10px 30px rgba(140, 98, 57, 0.05);
            z-index: 5;
        }

        /* تنسيق اللوجو وحذف الخلفية البيضاء نهائياً بالـ Filter */
        .logo-box {
            max-width: 160px;
            margin: 0 auto 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            background: transparent;
        }

        .logo {
            max-width: 100%;
            height: auto;
            /* فلتر متطور يقوم بتحويل اللون الأبيض الشفاف تماماً وعزل الشعار الأسود */
            filter: contrast(1.5) brightness(0.95) drop-shadow(0px 0px 1px rgba(0,0,0,0.05));
            mix-blend-mode: multiply;
        }

        h1 {
            color: var(--primary-color);
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .spin-win-text {
            font-family: 'Playfair Display', serif;
            font-size: 26px;
            font-style: italic;
            color: var(--accent-color);
            display: block;
            margin-top: 5px;
        }

        /* تصميم الأزرار الاحترافية والمحسنة */
        .btn-main {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 14px 45px;
            font-size: 18px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(176,125,83,0.3);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-weight: bold;
            width: 85%;
            font-family: 'Tajawal', sans-serif;
            display: inline-block;
            text-decoration: none;
        }

        .btn-main:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(176,125,83,0.45);
        }

        .btn-main:disabled {
            background-color: #b3b3b3 !important;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-insta {
            background-color: var(--insta-color);
            color: white;
            border: none;
            padding: 14px 35px;
            font-size: 16px;
            border-radius: 30px;
            cursor: pointer;
            margin-bottom: 15px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-weight: bold;
            text-decoration: none;
            width: 85%;
            box-sizing: border-box;
            box-shadow: 0 4px 12px rgba(214, 41, 118, 0.3);
            transition: all 0.3s ease;
            font-family: 'Tajawal', sans-serif;
        }

        .btn-insta:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(214, 41, 118, 0.45);
        }

        /* تحسين الفورم وحقول الإدخال */
        .form-group {
            margin-bottom: 18px;
            text-align: right;
            width: 85%;
            margin-left: auto;
            margin-right: auto;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0ceba;
            border-radius: 14px;
            background-color: #fffaf5;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s ease;
            text-align: center;
            font-family: 'Tajawal', sans-serif;
            font-weight: bold;
            color: var(--primary-color);
        }

        .form-group input:focus {
            border-color: var(--accent-color);
            background-color: #ffffff;
            box-shadow: 0 0 8px rgba(176,125,83,0.15);
        }

        /* إدارة تفعيل وتعطيل الشاشات */
        .screen {
            display: none;
        }

        .active-screen {
            display: block;
            animation: fadeIn 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        /* تصميم قسم العجلة والمؤشر */
        .wheel-outer-wrapper {
            position: relative;
            margin: 20px auto 30px auto;
            width: 300px;
            height: 300px;
        }

        .wheel-outer-wrapper::before {
            content: '';
            position: absolute;
            top: -14px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 16px solid transparent;
            border-right: 16px solid transparent;
            border-top: 26px solid var(--primary-color);
            z-index: 10;
        }

        .wheel-canvas-container {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            overflow: hidden;
            border: 5px solid var(--primary-color);
            box-shadow: 0 8px 25px rgba(140, 98, 57, 0.2);
        }

        #wheelCanvas {
            width: 100%;
            height: 100%;
            display: block;
            border-radius: 50%;
            transform: rotate(0deg);
            transition: transform 5s cubic-bezier(0.1, 0.8, 0.1, 1);
        }

        .result-message {
            font-size: 16px;
            font-weight: bold;
            color: var(--primary-color);
            margin: 15px auto;
            line-height: 1.6;
            max-width: 85%;
        }
    </style>
</head>
<body>

    <div class="floating-icons-container">
        <div class="floating-icon" style="left: 10%; animation-delay: 0s;">✨</div>
        <div class="floating-icon" style="left: 30%; animation-delay: 3s;">🌸</div>
        <div class="floating-icon" style="left: 70%; animation-delay: 1s;">✨</div>
        <div class="floating-icon" style="left: 85%; animation-delay: 5s;">💄</div>
    </div>

    <div class="container">
        <div class="logo-box">
            <img src="WhatsApp Image 2026-03-05 at 12.12.45 PM.jpeg" alt="صالة العناية | Hall Care" class="logo">
        </div>

        <div id="screen1" class="screen active-screen">
            <h1>مرحباً بك في سحب صالة العناية <span class="spin-win-text">Spin & Win</span></h1>
            
            <div class="form-group">
                <input type="text" id="userName" placeholder="الاسم الكريم الثلاثي">
            </div>
            <div class="form-group">
                <input type="tel" id="userPhone" placeholder="رقم الجوال (05xxxxxxxx)" maxlength="10">
            </div>

            <button class="btn-main" onclick="navigateToScreen2()">التالي</button>
        </div>

        <div id="screen2" class="screen">
            <h1>تابعنا على حساب إنستغرام<br>لتفعيل العجلة وبدء اللعب</h1>
            
            <a href="https://linktr.ee/HALLCARE?gad_source=1" target="_blank" class="btn-insta" onclick="unlockWheelButton()">
                <span>📸</span> افتح الرابط وتابعنا هنا
            </a>
            
            <button id="startPlayBtn" class="btn-main" disabled onclick="navigateToScreen3()">إبدأ اللعب الآن</button>
        </div>

        <div id="screen3" class="screen">
            <h1>أدر العجلة وحظاً موفقاً!</h1>
            
            <div class="wheel-outer-wrapper">
                <div class="wheel-canvas-container">
                    <canvas id="wheelCanvas" width="400" height="400"></canvas>
                </div>
            </div>

            <div id="resultOutput" class="result-message"></div>
            <button id="spinActionBtn" class="btn-main" onclick="startSpinAction()">أدر العجلة الآن</button>
        </div>
    </div>

    <script>
        let userData = {};
        let isSpinning = false;

        function navigateToScreen2() {
            const name = document.getElementById('userName').value.trim();
            const phone = document.getElementById('userPhone').value.trim();

            if (name.length < 3) {
                alert('الرجاء إدخال الاسم الكريم الثلاثي.');
                return;
            }
            if (phone.length < 9) {
                alert('الرجاء إدخال رقم جوال صحيح.');
                return;
            }

            userData = { name: name, phone: phone };
            
            document.getElementById('screen1').classList.remove('active-screen');
            document.getElementById('screen2').classList.add('active-screen');
        }

        function unlockWheelButton() {
            document.getElementById('startPlayBtn').disabled = false;
        }

        function navigateToScreen3() {
            document.getElementById('screen2').classList.remove('active-screen');
            document.getElementById('screen3').classList.add('active-screen');
            drawWheelStructure();
        }

        // قائمة الجوائز الرسمية والمنسقة للمجموعة 
        const prizesList = [
            'خصم ٢٠٪', 
            'تقسيمة ١٠ مللي', 
            'خصم ٥٪', 
            'دهن مسك مجاني', 
            'خصم ١٠٪', 
            'حظ أوفر', 
            'خصم ١٥٪', 
            'تقسيمة ٦ مللي'
        ];

        function drawWheelStructure() {
            const canvas = document.getElementById('wheelCanvas');
            const ctx = canvas.getContext('2d');
            const sectionsCount = prizesList.length;
            const arcSize = (2 * Math.PI) / sectionsCount;
            const center = canvas.width / 2;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < sectionsCount; i++) {
                const angle = i * arcSize;
                
                // تدوير الألوان بالتناوب الفخم المعتمد في هويتك
                ctx.fillStyle = (i % 2 === 0) ? '#b07d53' : '#d9b48f';
                
                ctx.beginPath();
                ctx.moveTo(center, center);
                ctx.arc(center, center, center - 5, angle, angle + arcSize);
                ctx.closePath();
                ctx.fill();

                // خطوط الفصل الدقيقة بين الجوائز
                ctx.strokeStyle = '#8c6239';
                ctx.lineWidth = 2;
                ctx.stroke();

                // كتابة نصوص الجوائز بشكل دائري احترافي داخل القطاع
                ctx.save();
                ctx.translate(center, center);
                ctx.rotate(angle + arcSize / 2);
                ctx.textAlign = "right";
                ctx.textBaseline = "middle";
                ctx.fillStyle = (i % 2 === 0) ? '#fffaf5' : '#8c6239';
                ctx.font = "bold 15px 'Tajawal', Arial";
                ctx.fillText(prizesList[i], center - 30, 0);
                ctx.restore();
            }

            // الدائرة المركزية الصغيرة لإعطاء شكل جمالي للعجلة
            ctx.beginPath();
            ctx.arc(center, center, 15, 0, 2 * Math.PI);
            ctx.fillStyle = '#f7e6d4';
            ctx.strokeStyle = '#8c6239';
            ctx.lineWidth = 3;
            ctx.fill();
            ctx.stroke();
        }

        function startSpinAction() {
            if (isSpinning) return;

            // التحقق من عدم تكرار المشاركة في نفس اليوم
            if (localStorage.getItem('hallCareSpunToday')) {
                document.getElementById('resultOutput').innerHTML = "عذراً! لقد شاركت في السحب اليوم بالفعل.<br>عد إلينا غداً لفرصة جديدة ⏳";
                disableSpinButton();
                return;
            }

            isSpinning = true;
            const canvas = document.getElementById('wheelCanvas');
            const totalSlices = prizesList.length;
            const degreesPerSlice = 360 / totalSlices;

            // اختيار عشوائي للجائزة الفائزة
            const luckyIndex = Math.floor(Math.random() * totalSlices);
            
            // حساب زاوية الدوران بدقة ليتوقف المؤشر العلوي عليها تماماً
            const targetOffset = 270 - (luckyIndex * degreesPerSlice) - (degreesPerSlice / 2);
            const finalRotation = (360 * 6) + targetOffset; // 6 دورات كاملة للتشويق

            canvas.style.transform = `rotate(${finalRotation}deg)`;

            setTimeout(() => {
                isSpinning = false;
                const wonPrize = prizesList[luckyIndex];
                const displayArea = document.getElementById('resultOutput');

                if (wonPrize === 'حظ أوفر') {
                    displayArea.innerHTML = `حظ أوفر المرة القادمة يا <strong>${userData.name}</strong>! 🤍<br>نسعد جداً بزيارتك وتجربتك القادمة.`;
                } else {
                    displayArea.innerHTML = `تهانينا يا <strong>${userData.name}</strong>! 🎉<br>لقد ربحت معنا: <span style="color:var(--primary-color); font-size:18px;">${wonPrize}</span><br>كود الجائزة الفوري: <strong>CARE2026</strong>`;
                }

                localStorage.setItem('hallCareSpunToday', 'true');
                disableSpinButton();
            }, 5000);
        }

        function disableSpinButton() {
            const btn = document.getElementById('spinActionBtn');
            btn.innerText = "عد إلينا غداً";
            btn.disabled = true;
            btn.style.backgroundColor = "#b3b3b3";
            btn.style.boxShadow = "none";
        }
    </script>
</body>
</html>
