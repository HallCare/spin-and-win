<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>عجلة الحظ - صالة العناية | Hall Care</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Tajawal:wght@500;800&family=Playfair+Display:ital,wght=1,600&display=swap" rel="stylesheet">

    <!-- Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

    <!-- QR CODE -->
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>

    <style>
        :root {
            --bg-color: #f5e4d3;
            --primary-color: #8c6239;
            --accent-color: #b07d53;
            --input-bg: #fffbf7;
            --insta-color: #d62976;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', 'Cairo', sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .floating-icons-container {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }

        .floating-icon {
            position: absolute;
            font-size: 24px;
            opacity: 0.15;
            animation: floatAnimation 14s linear infinite;
        }

        @keyframes floatAnimation {
            0% {
                transform: translateY(110vh) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 0.2;
            }

            90% {
                opacity: 0.2;
            }

            100% {
                transform: translateY(-10vh) rotate(360deg);
                opacity: 0;
            }
        }

        .container {
            text-align: center;
            max-width: 480px;
            width: 92%;
            padding: 40px 25px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 15px 35px rgba(140, 98, 57, 0.05);
            z-index: 5;
        }

        .logo-box {
            width: 160px;
            margin: auto;
            margin-bottom: 15px;
        }

        .logo {
            width: 100%;
        }

        h1 {
            color: var(--primary-color);
            font-size: 20px;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        .spin-win-text {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            font-style: italic;
            color: var(--accent-color);
            display: block;
            margin-top: 5px;
        }

        .form-group {
            width: 85%;
            margin: auto;
            margin-bottom: 16px;
        }

        .form-group input {
            width: 100%;
            padding: 15px;
            border-radius: 16px;
            border: 1px solid rgba(140, 98, 57, 0.15);
            background: var(--input-bg);
            font-size: 15px;
            text-align: center;
            font-family: inherit;
            outline: none;
            transition: 0.3s;
            font-weight: bold;
            color: var(--primary-color);
        }

        .form-group input:focus {
            border-color: var(--accent-color);
            transform: scale(1.02);
            background: white;
        }

        .btn-main,
        .btn-insta {
            width: 85%;
            border: none;
            border-radius: 30px;
            padding: 15px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
            transition: 0.3s;
        }

        .btn-main {
            background: var(--accent-color);
            color: white;
            margin-top: 10px;
            box-shadow: 0 5px 15px rgba(176, 125, 83, 0.25);
        }

        .btn-main:hover,
        .btn-insta:hover {
            transform: scale(1.03);
        }

        .btn-main:disabled {
            background: #bcbcbc !important;
            cursor: not-allowed;
        }

        .btn-insta {
            background: var(--insta-color);
            color: white;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
            margin-bottom: 15px;
        }

        .screen {
            display: none;
        }

        .active-screen {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.97);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .wheel-outer-wrapper {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 20px auto 30px;
        }

        .wheel-outer-wrapper::before {
            content: '';
            position: absolute;
            top: -14px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 16px solid transparent;
            border-right: 16px solid transparent;
            border-top: 26px solid var(--primary-color);
            z-index: 10;
        }

        .wheel-canvas-container {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            overflow: hidden;
            border: 5px solid var(--primary-color);
            box-shadow: 0 8px 25px rgba(140, 98, 57, 0.15);
        }

        #wheelCanvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            transition: transform 5s cubic-bezier(0.1, 0.8, 0.1, 1);
        }

        .result-message {
            font-size: 16px;
            color: var(--primary-color);
            line-height: 1.8;
            font-weight: bold;
            margin-top: 15px;
        }

        #countdownBox {
            margin-top: 15px;
            color: var(--primary-color);
            line-height: 1.7;
            font-weight: bold;
        }

        #qrCodeBox {
            background: white;
            width: 170px;
            height: 170px;
            margin: auto;
            padding: 10px;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        }
    </style>
</head>

<body>

    <!-- صوت -->
    <audio id="spinSound" preload="auto">
        <source src="https://assets.mixkit.co/active_storage/sfx/2003/2003-preview.mp3" type="audio/mpeg">
    </audio>

    <!-- Floating Icons -->
    <div class="floating-icons-container">
        <div class="floating-icon" style="left:8%;top:20%;animation-delay:0s;">✨</div>
        <div class="floating-icon" style="left:25%;top:45%;animation-delay:3s;">🌸</div>
        <div class="floating-icon" style="left:75%;top:15%;animation-delay:1s;">💄</div>
        <div class="floating-icon" style="left:88%;top:60%;animation-delay:5s;">✨</div>
    </div>

    <div class="container">

        <!-- Logo -->
        <div class="logo-box">
            <img src="Hallcare.png" class="logo">
        </div>

        <!-- SCREEN 1 -->
        <div id="screen1" class="screen active-screen">

            <h1>
                مرحباً بك في سحب صالة العناية
                <span class="spin-win-text">Spin & Win</span>
            </h1>

            <div class="form-group">
                <input type="text" id="userName" placeholder="الاسم الكريم الثلاثي">
            </div>

            <div class="form-group">
                <input type="tel" id="userPhone" placeholder="رقم الجوال (05xxxxxxxx)" maxlength="10">
            </div>

            <button class="btn-main" onclick="navigateToScreen2()">
                التالي
            </button>

        </div>

        <!-- SCREEN 2 -->
        <div id="screen2" class="screen">

            <h1>
                تابعنا على إنستغرام
                <br>
                لتفعيل العجلة 🎉
            </h1>

            <a href="https://linktr.ee/HALLCARE?gad_source=1"
                target="_blank"
                class="btn-insta"
                onclick="unlockWheelButton()">

                📸 افتح الرابط وتابعنا هنا

            </a>

            <!-- QR -->
            <div style="margin-bottom:20px;">

                <p style="color:#8c6239;font-weight:bold;">
                    أو امسح الكود 📱
                </p>

                <div id="qrCodeBox"></div>

            </div>

            <button id="startPlayBtn"
                class="btn-main"
                disabled
                onclick="navigateToScreen3()">

                ابدأ اللعب الآن

            </button>

        </div>

        <!-- SCREEN 3 -->
        <div id="screen3" class="screen">

            <h1>
                أدر العجلة وحظاً موفقاً 🎯
            </h1>

            <div class="wheel-outer-wrapper">

                <div class="wheel-canvas-container">

                    <canvas id="wheelCanvas"
                        width="400"
                        height="400"></canvas>

                </div>

            </div>

            <div id="resultOutput" class="result-message"></div>

            <div id="countdownBox"></div>

            <button id="spinActionBtn"
                class="btn-main"
                onclick="startSpinAction()">

                أدر العجلة الآن

            </button>

        </div>

    </div>

    <script>

        let userData = {};
        let isSpinning = false;

        const instagramLink = "https://linktr.ee/HALLCARE?gad_source=1";

        const weightedPrizes = [

            { text: 'خصم ٢٠٪', weight: 5 },
            { text: 'تقسيمة ١٠ مللي', weight: 3 },
            { text: 'خصم ٥٪', weight: 25 },
            { text: 'دهن مسك مجاني', weight: 2 },
            { text: 'خصم ١٠٪', weight: 15 },
            { text: 'حظ أوفر', weight: 35 },
            { text: 'خصم ١٥٪', weight: 10 },
            { text: 'تقسيمة ٦ مللي', weight: 5 }

        ];

        const prizesList = weightedPrizes.map(p => p.text);

        /* ===================== */
        /* QR CODE */
        /* ===================== */

        window.onload = () => {

            new QRCode(document.getElementById("qrCodeBox"), {

                text: instagramLink,
                width: 140,
                height: 140

            });

            checkCooldown();
        };

        /* ===================== */
        /* SCREEN 2 */
        /* ===================== */

        function navigateToScreen2() {

            const name =
                document.getElementById('userName').value.trim();

            const phone =
                document.getElementById('userPhone').value.trim();

            const phoneRegex = /^(05)\d{8}$/;

            if (name.length < 3) {

                alert('الرجاء إدخال الاسم الكريم الثلاثي');

                return;
            }

            if (!phoneRegex.test(phone)) {

                alert('أدخل رقم جوال صحيح يبدأ بـ 05');

                return;
            }

            userData = {
                name,
                phone
            };

            document.getElementById('screen1')
                .classList.remove('active-screen');

            document.getElementById('screen2')
                .classList.add('active-screen');
        }

        /* ===================== */
        /* ENABLE BUTTON */
        /* ===================== */

        function unlockWheelButton() {

            document.getElementById('startPlayBtn')
                .disabled = false;
        }

        /* ===================== */
        /* SCREEN 3 */
        /* ===================== */

        function navigateToScreen3() {

            document.getElementById('screen2')
                .classList.remove('active-screen');

            document.getElementById('screen3')
                .classList.add('active-screen');

            drawWheelStructure();
        }

        /* ===================== */
        /* DRAW WHEEL */
        /* ===================== */

        function drawWheelStructure() {

            const canvas =
                document.getElementById('wheelCanvas');

            const ctx =
                canvas.getContext('2d');

            const sectionsCount =
                prizesList.length;

            const arcSize =
                (2 * Math.PI) / sectionsCount;

            const center =
                canvas.width / 2;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < sectionsCount; i++) {

                const angle = i * arcSize;

                ctx.fillStyle =
                    (i % 2 === 0)
                        ? '#b07d53'
                        : '#d9b48f';

                ctx.beginPath();

                ctx.moveTo(center, center);

                ctx.arc(
                    center,
                    center,
                    center - 5,
                    angle,
                    angle + arcSize
                );

                ctx.closePath();

                ctx.fill();

                ctx.strokeStyle = '#8c6239';

                ctx.lineWidth = 2;

                ctx.stroke();

                ctx.save();

                ctx.translate(center, center);

                ctx.rotate(angle + arcSize / 2);

                ctx.textAlign = "right";

                ctx.fillStyle =
                    (i % 2 === 0)
                        ? '#fffaf5'
                        : '#8c6239';

                ctx.font = "bold 15px Tajawal";

                ctx.fillText(prizesList[i], center - 30, 0);

                ctx.restore();
            }

            ctx.beginPath();

            ctx.arc(center, center, 15, 0, 2 * Math.PI);

            ctx.fillStyle = '#f5e4d3';

            ctx.fill();

            ctx.strokeStyle = '#8c6239';

            ctx.lineWidth = 3;

            ctx.stroke();
        }

        /* ===================== */
        /* RANDOM PRIZE */
        /* ===================== */

        function getRandomPrizeIndex() {

            let num = Math.random() * 100;

            let currentSum = 0;

            for (let i = 0; i < weightedPrizes.length; i++) {

                currentSum += weightedPrizes[i].weight;

                if (num <= currentSum) {

                    return i;
                }
            }

            return 5;
        }

        /* ===================== */
        /* START SPIN */
        /* ===================== */

        function startSpinAction() {

            if (isSpinning) return;

            if (localStorage.getItem('hallCareSpinTime')) {

                showRemainingTime();

                return;
            }

            isSpinning = true;

            const spinSound =
                document.getElementById('spinSound');

            spinSound.currentTime = 0;

            spinSound.play();

            const canvas =
                document.getElementById('wheelCanvas');

            const totalSlices =
                prizesList.length;

            const degreesPerSlice =
                360 / totalSlices;

            const luckyIndex =
                getRandomPrizeIndex();

            const targetOffset =
                270 -
                (luckyIndex * degreesPerSlice) -
                (degreesPerSlice / 2);

            const finalRotation =
                (360 * 6) + targetOffset;

            canvas.style.transform =
                `rotate(${finalRotation}deg)`;

            setTimeout(() => {

                isSpinning = false;

                const wonPrize =
                    prizesList[luckyIndex];

                const displayArea =
                    document.getElementById('resultOutput');

                const next24Hours =
                    Date.now() + (24 * 60 * 60 * 1000);

                localStorage.setItem(
                    'hallCareSpinTime',
                    next24Hours
                );

                sendDataToGoogleSheets(wonPrize);

                if (wonPrize === 'حظ أوفر') {

                    displayArea.innerHTML =
                        `
                        حظ أوفر يا
                        <strong>${userData.name}</strong>
                        🤍
                        `;

                } else {

                    displayArea.innerHTML =
                        `
                        تهانينا يا
                        <strong>${userData.name}</strong>
                        🎉
                        <br><br>
                        لقد ربحت:
                        <br>
                        <span style="font-size:20px;color:#8c6239;">
                            ${wonPrize}
                        </span>
                        `;

                    confetti({

                        particleCount: 200,
                        spread: 100,
                        origin: { y: 0.6 }

                    });
                }

                disableSpinButton();

                showRemainingTime();

            }, 5000);
        }

        /* ===================== */
        /* DISABLE BUTTON */
        /* ===================== */

        function disableSpinButton() {

            const btn =
                document.getElementById('spinActionBtn');

            btn.disabled = true;

            btn.innerText = "تم اللعب اليوم";
        }

        /* ===================== */
        /* COUNTDOWN */
        /* ===================== */

        function showRemainingTime() {

            const countdownBox =
                document.getElementById('countdownBox');

            const savedTime =
                localStorage.getItem('hallCareSpinTime');

            if (!savedTime) return;

            const interval = setInterval(() => {

                const now = Date.now();

                const distance =
                    savedTime - now;

                if (distance <= 0) {

                    clearInterval(interval);

                    localStorage.removeItem('hallCareSpinTime');

                    countdownBox.innerHTML =
                        "يمكنك اللعب الآن 🎉";

                    document.getElementById('spinActionBtn')
                        .disabled = false;

                    return;
                }

                const hours =
                    Math.floor(distance / (1000 * 60 * 60));

                const minutes =
                    Math.floor(
                        (distance % (1000 * 60 * 60))
                        / (1000 * 60)
                    );

                const seconds =
                    Math.floor(
                        (distance % (1000 * 60))
                        / 1000
                    );

                countdownBox.innerHTML =
                    `
                    يمكنك اللعب بعد:
                    <br>
                    ${hours} ساعة
                    ${minutes} دقيقة
                    ${seconds} ثانية
                    `;
            }, 1000);
        }

        /* ===================== */
        /* CHECK COOLDOWN */
        /* ===================== */

        function checkCooldown() {

            if (localStorage.getItem('hallCareSpinTime')) {

                disableSpinButton();

                showRemainingTime();
            }
        }

        /* ===================== */
        /* GOOGLE SHEETS */
        /* ===================== */

        function sendDataToGoogleSheets(prize) {

            const scriptURL =
                "PUT_YOUR_GOOGLE_SCRIPT_URL_HERE";

            fetch(scriptURL, {

                method: 'POST',

                mode: 'no-cors',

                headers: {
                    'Content-Type': 'application/json'
                },

                body: JSON.stringify({

                    name: userData.name,

                    phone: userData.phone,

                    prize: prize,

                    date: new Date().toLocaleString()

                })

            });
        }

    </script>

</body>

</html>
