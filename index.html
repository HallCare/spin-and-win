<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عجلة الحظ - صالة العناية | Hall Care</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Tajawal:wght@500;800&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f5e4d3;
            --primary-color: #8c6239;
            --accent-color: #b07d53;
            --input-bg: #fffbf7;
            --insta-color: #d62976;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', 'Cairo', sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .floating-icons-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }

        .floating-icon {
            position: absolute;
            font-size: 28px;
            opacity: 0.18;
            filter: drop-shadow(0 2px 5px rgba(140, 98, 57, 0.15));
            animation: floatAnimation 12s linear infinite;
            bottom: -50px;
        }

        @keyframes floatAnimation {
            0% { transform: translateY(0) rotate(0deg) scale(0.8); opacity: 0; }
            15% { opacity: 0.25; }
            85% { opacity: 0.25; }
            100% { transform: translateY(-115vh) rotate(360deg) scale(1.2); opacity: 0; }
        }

        .container {
            text-align: center;
            max-width: 480px;
            width: 90%;
            padding: 30px 25px;
            box-sizing: border-box;
            background: rgba(255, 255, 255, 0.15); 
            border-radius: 24px;
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.35);
            box-shadow: 0 20px 45px rgba(140, 98, 57, 0.06);
            z-index: 5;
            position: relative;
        }

        .logo {
            width: 100%;
            max-width: 160px;
            height: auto;
            margin: 0 auto 20px auto;
            display: block;
            object-fit: contain;
        }

        h1 {
            color: var(--primary-color);
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .spin-win-text {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            font-style: italic;
            color: var(--accent-color);
            display: block;
            margin-top: 6px;
        }

        .form-group {
            margin-bottom: 16px;
            text-align: right;
            width: 85%;
            margin-left: auto;
            margin-right: auto;
        }

        .form-group input {
            width: 100%;
            padding: 15px 16px;
            border: 1.5px solid rgba(140, 98, 57, 0.18);
            border-radius: 16px; 
            background-color: var(--input-bg);
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
            text-align: center;
            font-family: 'Tajawal', sans-serif;
            font-weight: bold;
            color: var(--primary-color);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); 
        }

        .form-group input:hover,
        .form-group input:focus {
            border-color: var(--accent-color);
            background-color: #ffffff;
            transform: scale(1.02); 
            box-shadow: 0 5px 15px rgba(140, 98, 57, 0.05);
        }

        .btn-main {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 15px 45px;
            font-size: 17px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(176,125,83,0.2);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: bold;
            width: 85%;
            font-family: 'Tajawal', sans-serif;
            display: inline-block;
            text-decoration: none;
            margin-top: 10px;
        }

        .btn-main:hover {
            transform: scale(1.03); 
            box-shadow: 0 6px 20px rgba(176,125,83,0.35);
        }

        .btn-main:disabled {
            background-color: #b3b3b3 !important;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        .btn-insta {
            background-color: var(--insta-color);
            color: white;
            border: none;
            padding: 14px 35px;
            font-size: 16px;
            border-radius: 30px;
            cursor: pointer;
            margin-bottom: 15px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-weight: bold;
            text-decoration: none;
            width: 85%;
            box-sizing: border-box;
            box-shadow: 0 4px 12px rgba(214, 41, 118, 0.2);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: 'Tajawal', sans-serif;
        }

        .screen { display: none; }
        .active-screen { display: block; }

        .wheel-outer-wrapper {
            position: relative;
            margin: 20px auto 30px auto;
            width: 300px;
            height: 300px;
        }

        .wheel-canvas-container {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            overflow: hidden;
            border: 5px solid var(--primary-color);
        }

        #wheelCanvas {
            width: 100%;
            height: 100%;
            display: block;
            border-radius: 50%;
            transition: transform 5s cubic-bezier(0.1, 0.8, 0.1, 1);
        }

        .result-message {
            font-size: 16px;
            font-weight: bold;
            color: var(--primary-color);
            margin: 15px auto;
        }
    </style>
</head>
<body>

    <div class="floating-icons-container">
        <div class="floating-icon" style="left: 5%; animation-delay: 0s;">🧴</div>
        <div class="floating-icon" style="left: 28%; animation-delay: 1s;">💄</div>
        <div class="floating-icon" style="left: 65%; animation-delay: 2s;">✨</div>
        <div class="floating-icon" style="left: 92%; animation-delay: 4s;">💄</div>
    </div>

    <div class="container">
        <img id="projectLogo" src="Hallcare.png" alt="صالة العناية | Hall Care" class="logo" onerror="this.src='logo.png'; this.onerror=null;">

        <div id="screen1" class="screen active-screen">
            <h1>مرحباً بك في سحب صالة العناية <span class="spin-win-text">Spin & Win</span></h1>
            <div class="form-group"><input type="text" id="userName" placeholder="الاسم الكريم"></div>
            <div class="form-group"><input type="tel" id="userPhone" placeholder="رقم الجوال (05xxxxxxxx)"></div>
            <button class="btn-main" onclick="navigateToScreen2()">التالي</button>
        </div>

        <div id="screen2" class="screen">
            <h1>تابعنا على حساباتنا<br>لتفعيل العجلة وبدء اللعب</h1>
            <a href="https://linktr.ee/HALLCARE?gad_source=1" target="_blank" class="btn-insta" onclick="unlockWheelButton()">
                <span>🔗</span> افتح الرابط وتابعنا من هنا
            </a>
            <button id="startPlayBtn" class="btn-main" disabled onclick="navigateToScreen3()">إبدأ اللعب الآن</button>
        </div>

        <div id="screen3" class="screen">
            <h1>أدر العجلة وحظاً موفقاً!</h1>
            <div class="wheel-outer-wrapper">
                <div class="wheel-canvas-container"><canvas id="wheelCanvas" width="400" height="400"></canvas></div>
            </div>
            <div id="resultOutput" class="result-message"></div>
            <button id="spinActionBtn" class="btn-main" onclick="startSpinAction()">أدر العجلة الآن</button>
        </div>
    </div>

    <script>
        let userData = {};
        let isSpinning = false;
        const prizesList = ['خصم ٢٠٪', 'تقسيمة ١٠ مللي', 'خصم ٥٪', 'دهن مسك مجاني', 'خصم ١٠٪', 'حظ أوفر', 'خصم ١٥٪', 'تقسيمة ٦ مللي'];

        function navigateToScreen2() {
            const name = document.getElementById('userName').value.trim();
            const phone = document.getElementById('userPhone').value.trim();
            if (name === "" || phone === "") { alert('الرجاء تعبئة البيانات'); return; }
            userData = { name, phone };
            document.getElementById('screen1').classList.remove('active-screen');
            document.getElementById('screen2').classList.add('active-screen');
        }

        function unlockWheelButton() { document.getElementById('startPlayBtn').disabled = false; }

        function navigateToScreen3() {
            document.getElementById('screen2').classList.remove('active-screen');
            document.getElementById('screen3').classList.add('active-screen');
            drawWheelStructure();
        }

        function drawWheelStructure() {
            const canvas = document.getElementById('wheelCanvas');
            const ctx = canvas.getContext('2d');
            const sections = prizesList.length;
            const arc = (2 * Math.PI) / sections;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < sections; i++) {
                ctx.beginPath();
                ctx.moveTo(200, 200);
                ctx.arc(200, 200, 195, i * arc, (i + 1) * arc);
                ctx.fillStyle = (i % 2 === 0) ? '#b07d53' : '#d9b48f';
                ctx.fill();
                ctx.stroke();
            }
        }

        function startSpinAction() {
            if (isSpinning) return;
            isSpinning = true;
            const canvas = document.getElementById('wheelCanvas');
            const luckyIndex = Math.floor(Math.random() * prizesList.length);
            const rotation = (360 * 5) + (luckyIndex * (360 / prizesList.length));
            canvas.style.transform = `rotate(${rotation}deg)`;
            setTimeout(() => {
                isSpinning = false;
                document.getElementById('resultOutput').innerHTML = `تهانينا ${userData.name}! ربحت: ${prizesList[luckyIndex]}`;
            }, 5000);
        }
    </script>
</body>
</html>
