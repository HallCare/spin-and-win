<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TF Taksim Original - Spin & Win</title>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;600;700&family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f3dec9;       /* لون الخلفية الموحد والشامل لكامل الشاشة */
            --text-color: #a47652;     /* البني الفاخر للنصوص والخطوط الدقيقة */
            --btn-brown: #a97954;      /* لون الأزرار الانسيابية المعتمدة */
            --btn-insta: #bd337c;      /* الوردي المخصص لزر المتابعة */
        }

        * {
            box-sizing: border-box;
            font-family: 'Comfortaa', 'Cairo', sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
            color: var(--text-color);
            -webkit-tap-highlight-color: transparent;
        }

        /* سهم العودة للخلف الانسيابي في أعلى اليسار */
        .back-nav-arrow {
            position: absolute;
            top: 25px;
            left: 25px;
            width: 42px;
            height: 42px;
            background-color: #ffffff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(164, 118, 82, 0.12);
            z-index: 100;
            transition: all 0.2s ease;
            border: 1px solid rgba(164, 118, 82, 0.08);
        }

        .back-nav-arrow:hover {
            transform: scale(1.05);
        }

        /* حاوية التصميم الرئيسية المفتوحة على كامل الشاشة */
        .app-container-wrapper {
            text-align: center;
            max-width: 500px;
            width: 90%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* الشعار الدائري الشفاف المندمج تماماً بدون أي خلفيات بيضاء */
        .main-brand-logo-box {
            width: 140px;
            height: 140px;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: transparent;
        }

        .main-brand-logo {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            mix-blend-mode: multiply;
            filter: contrast(1.1);
        }

        /* ضبط الخطوط لتكون دقيقة ونحيفة طبق الأصل */
        .brand-main-heading {
            font-size: 20px;
            font-weight: 400;
            letter-spacing: 1.5px;
            margin: 0 0 8px 0;
            color: var(--text-color);
            text-transform: uppercase;
        }

        .brand-sub-heading-italic {
            font-size: 30px;
            font-weight: 300;
            letter-spacing: 0.5px;
            margin: 0 0 35px 0;
            color: var(--text-color);
        }

        /* كبسولات وعناصر استعراض الجوائز العلوية */
        .prizes-capsules-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            max-width: 420px;
            margin-bottom: 25px;
            direction: rtl;
        }

        .prize-capsule-item {
            background-color: rgba(214, 180, 151, 0.4);
            color: var(--text-color);
            padding: 6px 14px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 20px;
            border: 1px solid rgba(164, 118, 82, 0.12);
        }

        /* حقول إدخال البيانات البيضاوية والنظيفة تماماً */
        .input-fields-group {
            width: 100%;
            max-width: 300px;
            margin-bottom: 25px;
        }

        .app-rounded-input {
            width: 100%;
            padding: 13px 20px;
            border: 1.5px solid #e5d0be;
            border-radius: 30px;
            background-color: rgba(255, 252, 249, 0.55);
            font-size: 14px;
            outline: none;
            text-align: center;
            color: var(--text-color);
            font-weight: 600;
            margin-bottom: 12px;
            transition: all 0.3s ease;
        }

        .app-rounded-input:focus {
            border-color: var(--btn-brown);
            background-color: #ffffff;
            box-shadow: 0 4px 12px rgba(169, 121, 84, 0.08);
        }

        /* تصميم الأزرار البيضاوية الانسيابية طبق الأصل */
        .app-oval-btn {
            background-color: var(--btn-brown);
            color: white;
            border: none;
            padding: 13px 50px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 18px rgba(169, 121, 84, 0.3);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            width: 230px;
            display: inline-block;
            text-decoration: none;
            letter-spacing: 0.5px;
        }

        .app-oval-btn:hover {
            transform: translateY(-1.5px);
            box-shadow: 0 7px 22px rgba(169, 121, 84, 0.4);
        }

        .app-oval-btn:disabled {
            background-color: #cbbba8 !important;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        .app-oval-btn.insta-variant {
            background-color: var(--btn-insta);
            box-shadow: 0 5px 18px rgba(189, 51, 124, 0.25);
            margin-bottom: 15px;
        }

        .app-oval-btn.insta-variant:hover {
            box-shadow: 0 7px 22px rgba(189, 51, 124, 0.35);
        }

        /* إدارة تفعيل الشاشات وسلاستها */
        .stage-screen {
            display: none;
            width: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .stage-screen.active-stage {
            display: flex;
            animation: appFadeIn 0.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes appFadeIn {
            from { opacity: 0; transform: scale(0.99); }
            to { opacity: 1; transform: scale(1); }
        }

        /* تصميم هيكل العجلة الاحترافي مع الإطار المتطابق للموقع */
        .wheel-structural-frame {
            position: relative;
            width: 320px;
            height: 320px;
            margin: 10px auto 30px auto;
        }

        /* السهم المشير العلوي للجائزة */
        .wheel-structural-frame::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 14px solid transparent;
            border-right: 14px solid transparent;
            border-top: 22px solid var(--text-color);
            z-index: 50;
        }

        .canvas-wheel-vault {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 6px 25px rgba(164, 118, 82, 0.2);
            overflow: hidden;
            border: 4px solid var(--text-color);
        }

        #appLuckWheelCanvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            display: block;
            transform: rotate(0deg);
            transition: transform 5s cubic-bezier(0.1, 0.8, 0.1, 1);
        }

        /* رسالة وعرض المكافأة النهائية */
        .reward-output-text {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-color);
            margin-top: -5px;
            margin-bottom: 20px;
            line-height: 1.6;
            white-space: pre-line;
            max-width: 320px;
            direction: rtl;
        }
    </style>
</head>
