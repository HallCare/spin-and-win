<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عجلة الحظ - صالة العناية | Hall Care</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Tajawal:wght@500;800&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f7e6d4;      /* اللون الكريمي الهادئ للهوية البصرية */
            --primary-color: #8c6239; /* البني الداكن المعتمد للخطوط والعجلة */
            --accent-color: #b07d53;  /* البني الفاتح للأزرار والجوائز */
            --light-prize: #d9b48f;   /* اللون التناوبي الفاتح في العجلة */
            --insta-color: #d62976;   /* لون إنستغرام للأزرار */
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', 'Cairo', sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* تأثير العناصر المتطايرة في الخلفية */
        .floating-icons-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }

        .floating-icon {
            position: absolute;
            font-size: 24px;
            opacity: 0.25;
            animation: floatAnimation 12s linear infinite;
        }

        @keyframes floatAnimation {
            0% {
                transform: translateY(110vh) rotate(0deg) scale(0.8);
                opacity: 0;
            }
            10% {
                opacity: 0.3;
            }
            90% {
                opacity: 0.3;
            }
            100% {
                transform: translateY(-10vh) rotate(360deg) scale(1.2);
                opacity: 0;
            }
        }

        /* حاوية الصفحات الرئيسية */
        .container {
            text-align: center;
            max-width: 480px;
            width: 90%;
            padding: 30px 20px;
            box-sizing: border-box;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 20px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 10px 30px rgba(140, 98, 57, 0.05);
            z-index: 5;
        }

        /* عزل اللون الأبيض من الخلفية ليبقى اللوجو الأسود فقط */
        .logo-container {
            display: inline-block;
            margin-bottom: 15px;
            background: transparent;
        }

        .logo {
            max-width: 180px;
            height: auto;
            display: block;
            /* عزل اللون الأبيض برمجياً بشكل كامل ليصبح شفافاً */
            filter: multiply(1) contrast(1.2);
            mix-blend-mode: multiply;
        }

        h1 {
            color: var(--primary-color);
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .spin-win-text {
            font-family: 'Playfair Display', serif;
            font-size: 26px;
            font-style: italic;
            color: var(--accent-color);
            display: block;
            margin-top: 5px;
        }

        /* تصميم الأزرار الاحترافية والمحسنة */
        .btn-main {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 14px 45px;
            font-size: 18px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(176,125,83,0.3);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-weight: bold;
            width: 85%;
            font-family: 'Tajawal', sans-serif;
        }

        .btn-main:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(176,125,83,0.45);
        }

        .btn-main:disabled {
            background-color: #b3b3b3 !important;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-insta {
            background-color: var(--insta-color);
            color: white;
            border: none;
            padding: 14px 35px;
            font-size: 16px;
            border-radius: 30px;
            cursor: pointer;
            margin-bottom: 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-weight: bold;
            text-decoration: none;
            width: 85%;
            box-sizing: border-box;
            box-shadow: 0 4px 12px rgba(214, 41, 118, 0.3);
            transition: all 0.3s ease;
            font-family: 'Tajawal', sans-serif;
        }

        .btn-insta:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(214, 41, 118, 0.45);
        }

        /* تحسين الفورم وحقول الإدخال */
        .form-group {
            margin-bottom: 18px;
            text-align: right;
            width: 85%;
            margin-left: auto;
            margin-right: auto;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: var(--primary-color);
            font-size: 15px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0ceba;
            border-radius: 14px;
            background-color: #fffaf5;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s ease;
            text-align: right;
            font-family: 'Tajawal', sans-serif;
        }

        .form-group input:focus {
            border-color: var(--accent-color);
            background-color: #ffffff;
            box-shadow: 0 0 8px rgba(176,125,83,0.15);
        }

        .screen {
            display: none;
        }

        .active-screen {
            display: block;
            animation: fadeIn 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        /* تصميم قسم العجلة والمؤشر */
        .wheel-outer-wrapper {
            position: relative;
            margin: 30px auto;
            width: 320px;
            height: 320px;
        }

        /* السهم العلوي المشير للجائزة */
        .wheel-outer-wrapper::before {
            content: '';
            position: absolute;
            top: -14px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 16px solid transparent;
            border-right: 16px solid transparent;
            border-top: 26px solid var(--primary-color);
            z-index: 10;
        }

        .wheel-canvas-container {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 6px 25px rgba(140,98,57,0.3);
            overflow: hidden;
        }

        #wheelCanvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            display: block;
            transform: rotate(0deg);
            transition: transform 5s cubic-bezier(0.1, 0.8, 0.1, 1);
        }

        #resultMessage {
            font-size: 19px;
            font-weight: bold;
            color: var(--primary-color);
            margin-top: 22px;
            line-height: 1.6;
            white-space: pre-line;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="floating-icons-container" id="iconsContainer"></div>

    <div class="container">
        <div class="logo-container">
            <img src="WhatsApp Image 2026-03-05 at 12.12.45 PM.jpeg" alt="شعار صالة العناية" class="logo">
        </div>

        <div id="screen1" class="screen active-screen">
            <h1>مرحباً بك في سحب صالة العناية<br><span class="spin-win-text">Spin & Win</span></h1>
            
            <div class="form-group">
                <label for="username">الاسم الكريم:</label>
                <input type="text" id="username" placeholder="أدخل اسمك الثلاثي">
            </div>
            
            <div class="form-group">
                <label for="phone">رقم الجوال:</label>
                <input type="tel" id="phone" placeholder="05xxxxxxxx" maxlength="10">
            </div>
            
            <br>
            <button class="btn-main" onclick="validateAndProceed()">التالي</button>
        </div>

        <div id="screen2" class="screen">
            <h1>تابعنا على حساباتنا الرسمية<br>لتفعيل العجلة وبدء اللعب</h1>
            <a href="https://linktr.ee/HALLCARE?gad_source=1&gad_campaignid=23835021527&gclid=Cj0KCQjwoMXQBhDcARIsAH-eEtvM1zVCX1b5rpv_msdIPiJhAt2yLBuW6csJxlDA75nwWrhFgExzjdIaAkjREALw_wcB" target="_blank" class="btn-insta" onclick="unlockPlayButton()">📸 افتح الرابط وتابعنا هنا</a>
            <br><br><br>
            <button id="startPlayBtn" class="btn-main" disabled onclick="goToScreen(3)">إبدأ اللعب الآن</button>
        </div>

        <div id="screen3" class="screen">
            <h1>أدر العجلة وحظاً موفقاً!</h1>
            
            <div class="wheel-outer-wrapper">
                <div class="wheel-canvas-container">
                    <canvas id="wheelCanvas" width="400" height="400"></canvas>
                </div>
            </div>
            
            <button id="spinBtn" class="btn-main" onclick="triggerSpin()">تدوير العجلة 🎰</button>
            <p id="resultMessage"></p>
        </div>
    </div>

    <script>
        // 1. مؤثرات الخلفية المتساقطة للمنتجات
        const items = ['💄', '💅', '✨', '🧴', '🌸', '💜', '🛍️', '👑'];
        const container = document.getElementById('iconsContainer');
        const count = 20;

        for (let i = 0; i < count; i++) {
            const div = document.createElement('div');
            div.className = 'floating-icon';
            div.innerText = items[Math.floor(Math.random() * items.length)];
            div.style.left = Math.random() * 100 + '%';
            div.style.animationDelay = Math.random() * 8 + 's';
            div.style.fontSize = (Math.random() * 15 + 18) + 'px';
            container.appendChild(div);
        }

        // 2. الصوت التفاعلي أثناء دوران العجلة فقط (تم حذف صوت الماوس للأزرار)
        let audioCtx = null;
        let audioInterval = null;

        function playTickSound() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(550, audioCtx.currentTime); 
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.04);
            } catch (e) { console.log("Audio play blocked."); }
        }

        function startSpinningSound() {
            audioInterval = setInterval(() => {
                playTickSound();
            }, 65);
        }

        function stopSpinningSound() {
            if (audioInterval) clearInterval(audioInterval);
        }

        // 3. مصفوفة الجوائز
        const prizes = [
            'خصم 5%', 
            'دهن مسك مجاني', 
            'خصم 10%', 
            'حظ أوفر', 
            'خصم 15%', 
            'تقسيمة 6 مللي', 
            'خصم 20%', 
            'تقسيمة 10 مللي'
        ];

        let isSpinning = false;
        let userData = {};

        function goToScreen(num) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
            document.getElementById('screen' + num).classList.add('active-screen');
            if(num === 3) {
                renderCanvasWheel();
            }
        }

        function validateAndProceed() {
            const name = document.getElementById('username').value.trim();
            const phone = document.getElementById('phone').value.trim();

            if(!name || name.length < 3) {
                alert('الرجاء إدخال الاسم الثلاثي الكريم.');
                return;
            }
            if(!phone || phone.length < 9) {
                alert('الرجاء إدخال رقم جوال صحيح.');
                return;
            }

            userData = { name, phone };
            goToScreen(2);
        }

        function unlockPlayButton() {
            document.getElementById('startPlayBtn').disabled = false;
        }

        // 4. رسم العجلة
        function renderCanvasWheel() {
            const canvas = document.getElementById('wheelCanvas');
            const ctx = canvas.getContext('2d');
            const numSegments = prizes.length;
            const anglePerSeg = (2 * Math.PI) / numSegments;
            const radius = canvas.width / 2;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < numSegments; i++) {
                const startAngle = i * anglePerSeg;
                const endAngle = startAngle + anglePerSeg;

                ctx.fillStyle = (i % 2 === 0) ? '#d9b48f' : '#8c6239';
                
                ctx.beginPath();
                ctx.moveTo(radius, radius);
                ctx.arc(radius, radius, radius - 6, startAngle, endAngle);
                ctx.closePath();
                ctx.fill();

                ctx.strokeStyle = '#8c6239';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.save();
                ctx.translate(radius, radius);
                ctx.rotate(startAngle + anglePerSeg / 2);
                ctx.textAlign = "right";
                ctx.textBaseline = "middle";
                ctx.fillStyle = (i % 2 === 0) ? '#8c6239' : '#f7e6d4';
                ctx.font = "bold 15px 'Tajawal', Arial";
                
                ctx.fillText(prizes[i], radius - 30, 0);
                ctx.restore();
            }

            ctx.beginPath();
            ctx.arc(radius, radius, 22, 0, 2 * Math.PI);
            ctx.fillStyle = '#f7e6d4';
            ctx.strokeStyle = '#8c6239';
            ctx.lineWidth = 4;
            ctx.fill();
            ctx.stroke();
        }

        // 5. حركة الدوران والنتائج
        function triggerSpin() {
            if (isSpinning) return;

            if (localStorage.getItem('hallCareSpun')) {
                document.getElementById('resultMessage').innerText = "عذراً! لقد شاركت بالسحب اليوم بالفعل. \nعد إلينا غداً لفرصة جديدة ⏳";
                disableSpinButton();
                return;
            }

            isSpinning = true;
            startSpinningSound(); 

            const canvas = document.getElementById('wheelCanvas');
            const totalSegments = prizes.length;
            const degPerSeg = 360 / totalSegments;
            
            const winningIndex = Math.floor(Math.random() * totalSegments);
            const stopAngle = 270 - (winningIndex * degPerSeg) - (degPerSeg / 2);
            const finalRotation = (360 * 8) + stopAngle;

            canvas.style.transform = `rotate(${finalRotation}deg)`;

            setTimeout(() => {
                stopSpinningSound(); 
                
                const finalPrize = prizes[winningIndex];
                const msgElement = document.getElementById('resultMessage');

                if (finalPrize === 'حظ أوفر') {
                    msgElement.innerHTML = `حظ أوفر المرة القادمة يا <strong>${userData.name}</strong>! 💜<br>نسعد بزيارتك ومحاولتك مجدداً في وقت لاحق.`;
                } else {
                    msgElement.innerHTML = `تهانينا يا <strong>${userData.name}</strong>! 🎉<br>لقد ربحت معنا: <span style="color:#b07d53; font-size:20px;">${finalPrize}</span><br>كود تفعيل الجائزة الخاص بك: <strong>CARE2026</strong>`;
                }

                localStorage.setItem('hallCareSpun', 'true');
                disableSpinButton();
                isSpinning = false;
            }, 5000); 
        }

        function disableSpinButton() {
            const btn = document.getElementById('spinBtn');
            btn.innerText = "عد إلينا غداً";
            btn.disabled = true;
        }
    </script>
</body>
</html>
