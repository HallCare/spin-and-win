<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عجلة الحظ - صالة العناية | Hall Care</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f7e6d4;
            --primary-color: #8c6239;
            --accent-color: #b07d53;
        }
        body { background-color: var(--bg-color); font-family: 'Tajawal', sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        /* الحاوية الأساسية */
        .container { text-align: center; max-width: 480px; width: 90%; }
        
        /* الحل الجذري للوحة البيضاء في اللوجو */
        .logo { 
            max-width: 180px; 
            margin-bottom: 20px;
            /* هذا الفلتر يدمج اللوجو مع لون الخلفية الكريمي ويخفي أي لون أبيض */
            mix-blend-mode: multiply; 
            filter: brightness(0.9) contrast(1.1);
        }
        
        .screen { display: none; }
        .active { display: block; }
        
        input { width: 80%; padding: 15px; margin: 10px 0; border-radius: 15px; border: 1px solid #dcdcdc; text-align: center; }
        button { background: var(--accent-color); color: white; border: none; padding: 15px 40px; border-radius: 30px; cursor: pointer; font-size: 16px; margin-top: 20px; }
        a { text-decoration: none; }
    </style>
</head>
<body>

<div class="container">
    <div id="screen1" class="screen active">
        <img src="WhatsApp Image 2026-03-05 at 12.12.45 PM.jpeg" class="logo">
        <h1>صالة العناية | Hall Care</h1>
        <input type="text" id="name" placeholder="الاسم الكريم">
        <br>
        <input type="tel" id="phone" placeholder="رقم الجوال">
        <br>
        <button onclick="showScreen(2)">التالي</button>
    </div>

    <div id="screen2" class="screen">
        <h1>تابعنا على إنستغرام</h1>
        <a href="https://linktr.ee/HALLCARE" target="_blank">
            <button>افتح الرابط وتابعنا</button>
        </a>
        <br>
        <button onclick="showScreen(3)">إبدأ اللعب</button>
    </div>

    <div id="screen3" class="screen">
        <h1>استمتع باللعب!</h1>
        <p>عجلة الحظ في انتظارك...</p>
    </div>
</div>

<script>
    function showScreen(n) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('screen' + n).classList.add('active');
    }
</script>
</body>
</html>
