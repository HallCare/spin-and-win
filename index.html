<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TF Taksim Original - Spin & Win</title>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;600;700&family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f3dec9;       /* لون الخلفية الموحد والشامل لكامل الشاشة */
            --text-color: #a47652;     /* البني الفاخر للنصوص والخطوط الدقيقة */
            --btn-brown: #a97954;      /* لون الأزرار الانسيابية المعتمدة */
            --btn-insta: #bd337c;      /* الوردي المخصص لزر المتابعة */
        }

        * {
            box-sizing: border-box;
            font-family: 'Comfortaa', 'Cairo', sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
            color: var(--text-color);
            -webkit-tap-highlight-color: transparent;
        }

        /* سهم العودة للخلف الانسيابي في أعلى اليسار */
        .back-nav-arrow {
            position: absolute;
            top: 25px;
            left: 25px;
            width: 42px;
            height: 42px;
            background-color: #ffffff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(164, 118, 82, 0.12);
            z-index: 100;
            transition: all 0.2s ease;
            border: 1px solid rgba(164, 118, 82, 0.08);
        }

        .back-nav-arrow:hover {
            transform: scale(1.05);
        }

        /* حاوية التصميم الرئيسية المفتوحة على كامل الشاشة */
        .app-container-wrapper {
            text-align: center;
            max-width: 500px;
            width: 90%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* حاوية الشعار المحدثة هندسياً للتخلص من المربع الأبيض */
        .main-brand-logo-box {
            width: 140px;
            height: 140px;
            margin-bottom: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: transparent;
            border-radius: 0;
            padding: 0;
            box-shadow: none;
        }

        /* دمج الصورة برمجياً لإلغاء اللون الأبيض وجعل الشعار شفاف ومطابق تماماً */
        .main-brand-logo {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            mix-blend-mode: multiply;  /* هذه الخاصية السحرية تحذف الخلفية البيضاء تلقائياً */
            filter: contrast(1.1) darken;
        }

        /* ضبط الخطوط لتكون دقيقة ونحيفة طبق الأصل */
        .brand-main-heading {
            font-size: 20px;
            font-weight: 400;
            letter-spacing: 1.5px;
            margin: 0 0 8px 0;
            color: var(--text-color);
            text-transform: uppercase;
        }

        .brand-sub-heading-italic {
            font-size: 30px;
            font-weight: 300;
            letter-spacing: 0.5px;
            margin: 0 0 35px 0;
            color: var(--text-color);
        }

        /* كبسولات وعناصر استعراض الجوائز العلوية */
        .prizes-capsules-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            max-width: 420px;
            margin-bottom: 25px;
            direction: rtl;
        }

        .prize-capsule-item {
            background-color: rgba(214, 180, 151, 0.4);
            color: var(--text-color);
            padding: 6px 14px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 20px;
            border: 1px solid rgba(164, 118, 82, 0.12);
        }

        /* حقول إدخال البيانات البيضاوية والنظيفة تماماً */
        .input-fields-group {
            width: 100%;
            max-width: 300px;
            margin-bottom: 25px;
        }

        .app-rounded-input {
            width: 100%;
            padding: 13px 20px;
            border: 1.5px solid #e5d0be;
            border-radius: 30px;
            background-color: rgba(255, 252, 249, 0.55);
            font-size: 14px;
            outline: none;
            text-align: center;
            color: var(--text-color);
            font-weight: 600;
            margin-bottom: 12px;
            transition: all 0.3s ease;
        }

        .app-rounded-input:focus {
            border-color: var(--btn-brown);
            background-color: #ffffff;
            box-shadow: 0 4px 12px rgba(169, 121, 84, 0.08);
        }

        /* تصميم الأزرار البيضاوية الانسيابية طبق الأصل */
        .app-oval-btn {
            background-color: var(--btn-brown);
            color: white;
            border: none;
            padding: 13px 50px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 18px rgba(169, 121, 84, 0.3);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            width: 230px;
            display: inline-block;
            text-decoration: none;
            letter-spacing: 0.5px;
        }

        .app-oval-btn:hover {
            transform: translateY(-1.5px);
            box-shadow: 0 7px 22px rgba(169, 121, 84, 0.4);
        }

        .app-oval-btn:disabled {
            background-color: #cbbba8 !important;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        .app-oval-btn.insta-variant {
            background-color: var(--btn-insta);
            box-shadow: 0 5px 18px rgba(189, 51, 124, 0.25);
            margin-bottom: 15px;
        }

        .app-oval-btn.insta-variant:hover {
            box-shadow: 0 7px 22px rgba(189, 51, 124, 0.35);
        }

        /* إدارة تفعيل الشاشات وسلاستها */
        .stage-screen {
            display: none;
            width: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .stage-screen.active-stage {
            display: flex;
            animation: appFadeIn 0.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes appFadeIn {
            from { opacity: 0; transform: scale(0.99); }
            to { opacity: 1; transform: scale(1); }
        }

        /* تصميم هيكل العجلة الاحترافي مع الإطار المتطابق للموقع */
        .wheel-structural-frame {
            position: relative;
            width: 320px;
            height: 320px;
            margin: 10px auto 30px auto;
        }

        /* السهم المشير العلوي للجائزة */
        .wheel-structural-frame::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 14px solid transparent;
            border-right: 14px solid transparent;
            border-top: 22px solid var(--text-color);
            z-index: 50;
        }

        .canvas-wheel-vault {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 6px 25px rgba(164, 118, 82, 0.2);
            overflow: hidden;
            border: 4px solid var(--text-color);
        }

        #appLuckWheelCanvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            display: block;
            transform: rotate(0deg);
            transition: transform 5s cubic-bezier(0.1, 0.8, 0.1, 1);
        }

        /* رسالة وعرض المكافأة النهائية */
        .reward-output-text {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-color);
            margin-top: -5px;
            margin-bottom: 20px;
            line-height: 1.6;
            white-space: pre-line;
            max-width: 320px;
            direction: rtl;
        }
    </style>
</head>
<body>

    <div class="back-nav-arrow" id="appBackArrow" onclick="triggerBackStep()" style="display: none;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a47652" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
    </div>

    <div class="app-container-wrapper">
        <div class="main-brand-logo-box">
            <img src="WhatsApp Image 2026-03-05 at 12.12.45 PM.jpeg" alt="Hall Care Logo" class="main-brand-logo">
        </div>

        <div id="stageScreen1" class="stage-screen active-stage">
            <h1 class="brand-main-heading">WELCOME TO TF TAKSIM ORIGINAL</h1>
            <p class="brand-sub-heading-italic">Spin & Win</p>
            
            <div class="input-fields-group">
                <input type="text" id="clName" class="app-rounded-input" placeholder="الاسم الكريم الثلاثي">
                <input type="tel" id="clPhone" class="app-rounded-input" placeholder="رقم الجوال (05xxxxxxxx)" maxlength="10">
            </div>

            <button class="app-oval-btn" onclick="processIdentityAndNext()">Spin Now</button>
        </div>

        <div id="stageScreen2" class="stage-screen">
            <h1 class="brand-main-heading">FOLLOW US ON INSTAGRAM</h1>
            <p class="brand-sub-heading-italic" style="font-size: 22px; margin-bottom: 25px;">TO START PLAY</p>
            
            <a href="https://linktr.ee/HALLCARE" target="_blank" class="app-oval-btn insta-variant" onclick="enableWheelAccess()">Open & Follow</a>
            <button id="activatePlayBtn" class="app-oval-btn" disabled onclick="switchStageScreen(3)">START NOW</button>
        </div>

        <div id="stageScreen3" class="stage-screen">
            <p class="brand-sub-heading-italic" style="font-size: 22px; margin-bottom: 15px;">Spin the wheel to win</p>
            
            <div class="prizes-capsules-grid">
                <div class="prize-capsule-item">خصم ٢٠٪</div>
                <div class="prize-capsule-item">تقسيمة ١٠ مللي</div>
                <div class="prize-capsule-item">خصم ٥٪</div>
                <div class="prize-capsule-item">دهن مسك مجاني</div>
                <div class="prize-capsule-item">خصم ١٠٪</div>
                <div class="prize-capsule-item">حظ اوفر</div>
                <div class="prize-capsule-item">خصم ١٥٪</div>
                <div class="prize-capsule-item">تقسيمة ٦ مللي</div>
            </div>

            <div class="wheel-structural-frame">
                <div class="canvas-wheel-vault">
                    <canvas id="appLuckWheelCanvas" width="400" height="400"></canvas>
                </div>
            </div>
            
            <div id="appRewardStatusBox" class="reward-output-text"></div>
            <button id="appTriggerSpinBtn" class="app-oval-btn" onclick="executeWheelRotation()">START NOW</button>
        </div>
    </div>

    <script>
        let screenPointer = 1;
        let clientDataObj = {};
        let rotationActive = false;

        function switchStageScreen(targetNum) {
            document.querySelectorAll('.stage-screen').forEach(sc => sc.classList.remove('active-stage'));
            document.getElementById('stageScreen' + targetNum).classList.add('active-stage');
            screenPointer = targetNum;

            const backArrow = document.getElementById('appBackArrow');
            if (targetNum === 2) {
                backArrow.style.display = 'flex';
            } else {
                backArrow.style.display = 'none';
            }

            if (targetNum === 3) {
                renderVectorWheel();
            }
        }

        function triggerBackStep() {
            if (screenPointer === 2) {
                switchStageScreen(1);
            }
        }

        function processIdentityAndNext() {
            const entryName = document.getElementById('clName').value.trim();
            const entryPhone = document.getElementById('clPhone').value.trim();

            if (!entryName || entryName.length < 3) {
                alert('الرجاء تزويدنا بالاسم الكريم الثلاثي.');
                return;
            }
            if (!entryPhone || entryPhone.length < 9) {
                alert('الرجاء إدخال رقم جوال صحيح.');
                return;
            }

            clientDataObj = { name: entryName, phone: entryPhone };
            switchStageScreen(2);
        }

        function enableWheelAccess() {
            document.getElementById('activatePlayBtn').disabled = false;
        }

        const corePrizeArray = [
            'خصم ٢٠٪', 
            'تقسيمة ١٠ مللي', 
            'خصم ٥٪', 
            'دهن مسك مجاني', 
            'خصم ١٠٪', 
            'حظ اوفر', 
            'خصم ١٥٪', 
            'تقسيمة ٦ مللي'
        ];

        function renderVectorWheel() {
            const canvas = document.getElementById('appLuckWheelCanvas');
            const ctx = canvas.getContext('2d');
            const totalSlices = corePrizeArray.length;
            const sliceRad = (2 * Math.PI) / totalSlices;
            const middleX = canvas.width / 2;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < totalSlices; i++) {
                const startAngle = i * sliceRad;
                const endAngle = startAngle + sliceRad;

                ctx.fillStyle = (i % 2 === 0) ? '#d6b497' : '#a1724d';
                
                ctx.beginPath();
                ctx.moveTo(middleX, middleX);
                ctx.arc(middleX, middleX, middleX - 2, startAngle, endAngle);
                ctx.closePath();
                ctx.fill();

                ctx.strokeStyle = '#a47652';
                ctx.lineWidth = 1.2;
                ctx.stroke();

                ctx.save();
                ctx.translate(middleX, middleX);
                ctx.rotate(startAngle + sliceRad / 2);
                ctx.textAlign = "right";
                ctx.textBaseline = "middle";
                ctx.fillStyle = (i % 2 === 0) ? '#a1724d' : '#f3dec9';
                ctx.font = "bold 14px 'Cairo', Arial";
                
                ctx.fillText(corePrizeArray[i], middleX - 35, 0);
                ctx.restore();
            }

            ctx.beginPath();
            ctx.arc(middleX, middleX, 16, 0, 2 * Math.PI);
            ctx.fillStyle = '#f3dec9';
            ctx.strokeStyle = '#a47652';
            ctx.lineWidth = 3;
            ctx.fill();
            ctx.stroke();
        }

        let audioContext = null;
        let rotationSoundInterval = null;

        function playDynamicTick(frequency) {
            try {
                if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
                let osc = audioContext.createOscillator();
                let gain = audioContext.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(frequency, audioContext.currentTime); 
                gain.gain.setValueAtTime(0.05, audioContext.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.04);
                osc.connect(gain);
                gain.connect(audioContext.destination);
                osc.start();
                osc.stop(audioContext.currentTime + 0.04);
            } catch (e) { }
        }

        function runAudioEngine() {
            let delay = 60;
            let currentFreq = 520;
            
            function scheduleTick() {
                if (!rotationActive) return;
                playDynamicTick(currentFreq);
                
                if (delay < 400) {
                    delay += 6; 
                    currentFreq -= 3;
                }
                rotationSoundInterval = setTimeout(scheduleTick, delay);
            }
            scheduleTick();
        }

        function executeWheelRotation() {
            if (rotationActive) return;

            if (localStorage.getItem('taksimOriginalSpun')) {
                document.getElementById('appRewardStatusBox').innerText = "عذراً! لقد شاركت بالسحب اليوم بالفعل. \nعد إلينا غداً لفرصة جديدة ⏳";
                applyCompletionStyle();
                return;
            }

            rotationActive = true;
            runAudioEngine(); 

            const canvas = document.getElementById('appLuckWheelCanvas');
            const slicesCount = corePrizeArray.length;
            const degreesPerSlice = 360 / slicesCount;
            
            const selectedWinnerIndex = Math.floor(Math.random() * slicesCount);
            const stopAngleOffset = 270 - (selectedWinnerIndex * degreesPerSlice) - (degreesPerSlice / 2);
            const totalRotationDeg = (360 * 8) + stopAngleOffset;

            canvas.style.transform = `rotate(${totalRotationDeg}deg)`;

            setTimeout(() => {
                rotationActive = false;
                clearTimeout(rotationSoundInterval); 
                
                const finalPrizeString = corePrizeArray[selectedWinnerIndex];
                const displayArea = document.getElementById('appRewardStatusBox');

                if (finalPrizeString === 'حظ اوفر') {
                    displayArea.innerHTML = `حظ أوفر المرة القادمة يا <strong>${clientDataObj.name}</strong>! 🤍<br>نسعد جداً بزيارتك ومحاولتك مجدداً.`;
                } else {
                    displayArea.innerHTML = `تهانينا يا <strong>${clientDataObj.name}</strong>! 🎉<br>لقد ربحت معنا: <span style="color:#a97954; font-size:18px;">${finalPrizeString}</span><br>كود الجائزة الفوري: <strong>TAKSIM2026</strong>`;
                }

                localStorage.setItem('taksimOriginalSpun', 'true');
                applyCompletionStyle();
            }, 5000); 
        }

        function applyCompletionStyle() {
            const actionBtn = document.getElementById('appTriggerSpinBtn');
            actionBtn.innerText = "Come Back Tomorrow";
            actionBtn.disabled = true;
            actionBtn.style.backgroundColor = "#9da3a6";
            actionBtn.style.boxShadow = "none";
        }
    </script>
</body>
</html>
