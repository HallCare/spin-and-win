<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عجلة الحظ - صالة العناية</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #f5e4d3; --primary-color: #8c6239; --btn-color: #b07d53; }
        body { margin: 0; font-family: 'Tajawal', sans-serif; background-color: var(--bg-color); display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        .container { text-align: center; max-width: 400px; width: 90%; padding: 40px 25px; background: rgba(255, 255, 255, 0.5); border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .logo { width: 120px; margin-bottom: 20px; }
        h1 { color: var(--primary-color); font-size: 18px; margin-bottom: 20px; }
        
        input { width: 100%; padding: 15px; margin-bottom: 15px; border-radius: 10px; border: none; box-sizing: border-box; text-align: center; font-family: inherit; }
        .btn-main { background-color: var(--btn-color); color: white; border: none; padding: 15px; border-radius: 10px; width: 100%; cursor: pointer; font-weight: bold; font-family: inherit; }
        .btn-main:disabled { background-color: #a0a0a0; }

        .screen { display: none; }
        .active-screen { display: block; }
        
        .wheel-canvas-container { width: 280px; height: 280px; margin: 20px auto; border-radius: 50%; border: 6px solid var(--primary-color); overflow: hidden; }
        #wheelCanvas { width: 100%; height: 100%; transition: transform 5s cubic-bezier(0.1, 0.8, 0.1, 1); }
    </style>
</head>
<body>

    <div class="container">
        <img src="Hallcare.png" alt="Logo" class="logo">

        <div id="screen1" class="screen active-screen">
            <h1>مرحباً بك في سحب صالة العناية</h1>
            <input type="text" id="userName" placeholder="الاسم الكريم">
            <input type="tel" id="userPhone" placeholder="رقم الجوال">
            <button class="btn-main" onclick="navigateToScreen2()">التالي</button>
        </div>

        <div id="screen2" class="screen">
            <h1>تابعنا على حساباتنا للمزيد</h1>
            <button class="btn-main" onclick="navigateToScreen3()">إبدأ اللعب الآن</button>
        </div>

        <div id="screen3" class="screen">
            <h1>أدر العجلة وحظاً موفقاً!</h1>
            <div class="wheel-canvas-container">
                <canvas id="wheelCanvas" width="400" height="400"></canvas>
            </div>
            <div id="resultOutput" style="font-weight:bold; color:var(--primary-color); margin-bottom:10px;"></div>
            <button id="spinActionBtn" class="btn-main" onclick="startSpinAction()">أدر العجلة الآن</button>
        </div>
    </div>

    <script>
        const prizesList = ['٢٠٪', '١٠ مللي', '٥٪', 'مسك', '١٠٪', 'حظ أوفر', '١٥٪', '٦ مللي'];
        let userName = "";

        function navigateToScreen2() {
            userName = document.getElementById('userName').value;
            if(!userName) return alert("الرجاء إدخال الاسم");
            document.getElementById('screen1').classList.remove('active-screen');
            document.getElementById('screen2').classList.add('active-screen');
        }

        function navigateToScreen3() {
            document.getElementById('screen2').classList.remove('active-screen');
            document.getElementById('screen3').classList.add('active-screen');
            drawWheel();
            if (localStorage.getItem('lastSpinDate') === new Date().toDateString()) startTimer();
        }

        function drawWheel() {
            const ctx = document.getElementById('wheelCanvas').getContext('2d');
            const slice = (2 * Math.PI) / prizesList.length;
            prizesList.forEach((p, i) => {
                ctx.beginPath(); ctx.moveTo(200, 200);
                ctx.arc(200, 200, 200, i * slice, (i + 1) * slice);
                ctx.fillStyle = (i % 2 === 0) ? '#b07d53' : '#d9b48f';
                ctx.fill();
                ctx.save(); ctx.translate(200, 200); ctx.rotate(i * slice + slice / 2);
                ctx.fillStyle = "#fff"; ctx.font = "bold 20px Tajawal";
                ctx.fillText(p, 100, 10); ctx.restore();
            });
        }

        function startSpinAction() {
            const canvas = document.getElementById('wheelCanvas');
            const btn = document.getElementById('spinActionBtn');
            const luckyIndex = Math.floor(Math.random() * prizesList.length);
            canvas.style.transform = `rotate(${360 * 5 + (luckyIndex * 45)}deg)`;
            btn.disabled = true;
            setTimeout(() => {
                document.getElementById('resultOutput').innerHTML = `مبروك ${userName}! ربحت: ${prizesList[luckyIndex]}`;
                localStorage.setItem('lastSpinDate', new Date().toDateString());
                startTimer();
            }, 5000);
        }

        function startTimer() {
            const btn = document.getElementById('spinActionBtn');
            btn.disabled = true;
            const update = () => {
                const diff = new Date(new Date().setHours(24,0,0,0)) - new Date();
                btn.innerText = `عد غداً: ${Math.floor(diff/3600000)}:${Math.floor((diff%3600000)/60000)}:${Math.floor((diff%60000)/1000)}`;
            };
            setInterval(update, 1000); update();
        }
    </script>
</body>
</html>
