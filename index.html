<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عجلة الحظ - صالة العناية | Hall Care</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Tajawal:wght@500;800&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f5e4d3;      
            --primary-color: #8c6239; 
            --accent-color: #b07d53;  
            --input-bg: #fffbf7;      
            --insta-color: #d62976;   
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', 'Cairo', sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            text-align: center;
            max-width: 480px;
            width: 90%;
            padding: 30px 25px;
            background: rgba(255, 255, 255, 0.15); 
            border-radius: 24px;
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(255, 255, 255, 0.35);
            box-shadow: 0 20px 45px rgba(140, 98, 57, 0.06);
            z-index: 5;
        }

        .logo { width: 100%; max-width: 160px; margin: 0 auto 20px auto; display: block; }
        h1 { color: var(--primary-color); font-size: 20px; font-weight: 800; margin-bottom: 25px; line-height: 1.6; }
        .spin-win-text { font-family: 'Playfair Display', serif; font-size: 24px; font-style: italic; color: var(--accent-color); display: block; }
        
        .form-group { margin-bottom: 16px; width: 85%; margin-left: auto; margin-right: auto; }
        .form-group input { width: 100%; padding: 15px 16px; border: 1.5px solid rgba(140, 98, 57, 0.18); border-radius: 16px; background-color: var(--input-bg); text-align: center; font-weight: bold; color: var(--primary-color); box-sizing: border-box; outline: none; }

        .btn-main { background-color: var(--accent-color); color: white; border: none; padding: 15px 45px; font-size: 17px; border-radius: 30px; cursor: pointer; font-weight: bold; width: 85%; margin-top: 10px; font-family: 'Tajawal', sans-serif; }
        .btn-insta { background-color: var(--insta-color); color: white; border: none; padding: 14px 35px; font-size: 16px; border-radius: 30px; margin-bottom: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 10px; font-weight: bold; text-decoration: none; width: 85%; box-sizing: border-box; }

        .screen { display: none; }
        .active-screen { display: block; }

        .wheel-canvas-container { width: 300px; height: 300px; margin: 20px auto; border-radius: 50%; overflow: hidden; border: 5px solid var(--primary-color); }
        #wheelCanvas { width: 100%; height: 100%; transition: transform 5s cubic-bezier(0.1, 0.8, 0.1, 1); }
        .result-message { font-size: 16px; font-weight: bold; color: var(--primary-color); margin: 15px auto; }
    </style>
</head>
<body>

    <div class="container">
        <img src="Hallcare.png" alt="صالة العناية" class="logo">

        <div id="screen1" class="screen active-screen">
            <h1>مرحباً بك في سحب صالة العناية <span class="spin-win-text">Spin & Win</span></h1>
            <div class="form-group"><input type="text" id="userName" placeholder="الاسم الكريم"></div>
            <div class="form-group"><input type="tel" id="userPhone" placeholder="رقم الجوال"></div>
            <button class="btn-main" onclick="navigateToScreen2()">التالي</button>
        </div>

        <div id="screen2" class="screen">
            <h1>تابعنا على حساباتنا للمزيد من العروض</h1>
            <a href="https://linktr.ee/HALLCARE?gad_source=1" target="_blank" class="btn-insta">
                <span>🔗</span> افتح الرابط وتابعنا من هنا
            </a>
            <button class="btn-main" onclick="navigateToScreen3()">إبدأ اللعب الآن</button>
        </div>

        <div id="screen3" class="screen">
            <h1>أدر العجلة وحظاً موفقاً!</h1>
            <div class="wheel-canvas-container">
                <canvas id="wheelCanvas" width="400" height="400"></canvas>
            </div>
            <div id="resultOutput" class="result-message"></div>
            <button id="spinActionBtn" class="btn-main" onclick="startSpinAction()">أدر العجلة الآن</button>
        </div>
    </div>

    <script>
        let userData = {};
        const prizesList = ['خصم ٢٠٪', 'تقسيمة ١٠ مللي', 'خصم ٥٪', 'دهن مسك مجاني', 'خصم ١٠٪', 'حظ أوفر', 'خصم ١٥٪', 'تقسيمة ٦ مللي'];

        function navigateToScreen2() {
            const name = document.getElementById('userName').value.trim();
            if (name === "") { alert('الرجاء إدخال الاسم'); return; }
            userData.name = name;
            document.getElementById('screen1').classList.remove('active-screen');
            document.getElementById('screen2').classList.add('active-screen');
        }

        function navigateToScreen3() {
            document.getElementById('screen2').classList.remove('active-screen');
            document.getElementById('screen3').classList.add('active-screen');
            drawWheel();
        }

        function drawWheel() {
            const canvas = document.getElementById('wheelCanvas');
            const ctx = canvas.getContext('2d');
            const center = 200;
            ctx.clearRect(0, 0, 400, 400);
            prizesList.forEach((prize, i) => {
                const angle = i * (2 * Math.PI / prizesList.length);
                ctx.fillStyle = (i % 2 === 0) ? '#b07d53' : '#d9b48f';
                ctx.beginPath(); ctx.moveTo(center, center);
                ctx.arc(center, center, 195, angle, angle + (2 * Math.PI / prizesList.length));
                ctx.fill();
            });
        }

        function startSpinAction() {
            const canvas = document.getElementById('wheelCanvas');
            const luckyIndex = Math.floor(Math.random() * prizesList.length);
            const rotation = (360 * 5) + (luckyIndex * (360 / prizesList.length));
            canvas.style.transform = `rotate(${rotation}deg)`;
            
            document.getElementById('spinActionBtn').disabled = true;
            setTimeout(() => {
                document.getElementById('resultOutput').innerHTML = `تهانينا ${userData.name}!<br>لقد ربحت: <strong>${prizesList[luckyIndex]}</strong>`;
            }, 5000);
        }
    </script>
</body>
</html>
