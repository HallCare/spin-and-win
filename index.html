<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عجلة الحظ - صالة العناية | Hall Care</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Tajawal:wght@500;800&family=Playfair+Display:ital,wght=1,600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f5e4d3;      
            --primary-color: #8c6239; 
            --accent-color: #b07d53;  
            --input-bg: #fffbf7;      
            --insta-color: #d62976;   
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', 'Cairo', sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* حاوية عناصر العناية والبشرة العائمة في الخلفية */
        .floating-icons-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }

        .floating-icon {
            position: absolute;
            font-size: 28px;
            opacity: 0.18;
            filter: drop-shadow(0 2px 5px rgba(140, 98, 57, 0.15));
            animation: floatAnimation 12s linear infinite;
            bottom: -50px;
        }

        @keyframes floatAnimation {
            0% { 
                transform: translateY(0) rotate(0deg) scale(0.8); 
                opacity: 0; 
            }
            15% { 
                opacity: 0.25; 
            }
            85% { 
                opacity: 0.25; 
            }
            100% { 
                transform: translateY(-115vh) rotate(360deg) scale(1.2); 
                opacity: 0; 
            }
        }

        .container {
            text-align: center;
            max-width: 480px;
            width: 90%;
            padding: 40px 25px;
            box-sizing: border-box;
            background: rgba(255, 255, 255, 0.15); 
            border-radius: 24px;
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.35);
            box-shadow: 0 20px 45px rgba(140, 98, 57, 0.06);
            z-index: 5;
            position: relative;
        }

        .logo-box {
            width: 180px; 
            height: auto;
            margin: 0 auto 15px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: transparent;
        }

        .logo {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
            border-radius: 0; 
        }

        h1 {
            color: var(--primary-color);
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .spin-win-text {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            font-style: italic;
            color: var(--accent-color);
            display: block;
            margin-top: 6px;
        }

        .form-group {
            margin-bottom: 16px;
            text-align: right;
            width: 85%;
            margin-left: auto;
            margin-right: auto;
        }

        .form-group input {
            width: 100%;
            padding: 15px 16px;
            border: 1.5px solid rgba(140, 98, 57, 0.18);
            border-radius: 16px; 
            background-color: var(--input-bg);
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
            text-align: center;
            font-family: 'Tajawal', sans-serif;
            font-weight: bold;
            color: var(--primary-color);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); 
        }

        .form-group input:hover,
        .form-group input:focus {
            border-color: var(--accent-color);
            background-color: #ffffff;
            transform: scale(1.02); 
            box-shadow: 0 5px 15px rgba(140, 98, 57, 0.05);
        }

        .form-group input::placeholder {
            color: #bfa38a;
        }

        /* أزرار مضافة إليها تأثير اللمعان الاحترافي */
        .btn-main {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 15px 45px;
            font-size: 17px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(176,125,83,0.2);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: bold;
            width: 85%;
            font-family: 'Tajawal', sans-serif;
            display: inline-block;
            text-decoration: none;
            margin-top: 10px;
            position: relative;
            overflow: hidden;
        }

        .btn-main::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -60%;
            width: 30%;
            height: 200%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.3) 50%, rgba(255,255,255,0) 100%);
            transform: rotate(25deg);
            animation: shineEffect 4s ease-in-out infinite;
        }

        @keyframes shineEffect {
            0% { left: -60%; }
            15% { left: 130%; }
            100% { left: 130%; }
        }

        .btn-main:hover {
            transform: scale(1.03); 
            box-shadow: 0 6px 20px rgba(176,125,83,0.35);
        }

        .btn-main:disabled {
            background-color: #b3b3b3 !important;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        .btn-main:disabled::after {
            display: none;
        }

        /* زر لينك تري المضاف إليه أنيميشن النبض المتناسق لجذب النقرات */
        .btn-insta {
            background-color: var(--insta-color);
            color: white;
            border: none;
            padding: 14px 35px;
            font-size: 16px;
            border-radius: 30px;
            cursor: pointer;
            margin-bottom: 15px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-weight: bold;
            text-decoration: none;
            width: 85%;
            box-sizing: border-box;
            box-shadow: 0 4px 12px rgba(214, 41, 118, 0.2);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: 'Tajawal', sans-serif;
            animation: pulseAttention 2s infinite;
        }

        @keyframes pulseAttention {
            0% { transform: scale(1); box-shadow: 0 4px 12px rgba(214, 41, 118, 0.2); }
            50% { transform: scale(1.03); box-shadow: 0 6px 20px rgba(214, 41, 118, 0.45); }
            100% { transform: scale(1); box-shadow: 0 4px 12px rgba(214, 41, 118, 0.2); }
        }

        .btn-insta:hover {
            animation-play-state: paused;
            transform: scale(1.04);
        }

        .screen {
            display: none;
        }

        .active-screen {
            display: block;
            animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        .wheel-outer-wrapper {
            position: relative;
            margin: 20px auto 30px auto;
            width: 300px;
            height: 300px;
        }

        .wheel-outer-wrapper::before {
            content: '';
            position: absolute;
            top: -14px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 16px solid transparent;
            border-right: 16px solid transparent;
            border-top: 26px solid var(--primary-color);
            z-index: 10;
        }

        .wheel-canvas-container {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            overflow: hidden;
            border: 5px solid var(--primary-color);
            box-shadow: 0 8px 25px rgba(140, 98, 57, 0.15);
        }

        #wheelCanvas {
            width: 100%;
            height: 100%;
            display: block;
            border-radius: 50%;
            transform: rotate(0deg);
            transition: transform 5s cubic-bezier(0.1, 0.8, 0.1, 1);
            will-change: transform;
        }

        .result-message {
            font-size: 16px;
            font-weight: bold;
            color: var(--primary-color);
            margin: 15px auto;
            line-height: 1.6;
            max-width: 85%;
        }
    </style>
</head>
<body>

        <div class="floating-icon" style="left: 15%; animation-delay: 3s; animation-duration: 14s;">✨</div>

        <div class="floating-icon" style="left: 45%; animation-delay: 5s; animation-duration: 15s;">🪞</div>
        <div class="floating-icon" style="left: 65%; animation-delay: 2s; animation-duration: 13s;">✨</div>

                    <canvas id="wheelCanvas" width="400" height="400"></canvas>
