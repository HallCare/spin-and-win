<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hall Care Spin & Win</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-wrapper">
        <header>
            <img src="transparent-hallcare-logo.svg" alt="Hall Care Logo" class="transparent-logo">
        </header>

        <main class="content-panel">
            <div class="welcome-text">مرحبا بك في سحب صالة العناية</div>
            <div class="spin-win-script">Spin & Win</div>

            <form class="input-form">
                <input type="text" placeholder="الاسم الكريم الثلاثي" class="pill-input">
                <input type="tel" placeholder="رقم الجوال (05xxxxxxxx)" class="pill-input">
                <button type="submit" class="bronze-button pill-button">التالي</button>
            </form>

            <div class="flow-divider"></div>

            <div class="follow-prompt">
                <div class="follow-text">تابعنا على حساب إنستغرام لتعفيل العجلة وبدء اللعب</div>
                <a href="#" class="pink-button pill-button">📸 افتح الرابط وتابعنا هنا</a>
                <button type="button" class="gray-button pill-button disabled" disabled>ابدأ اللعب الآن <span class="lock-icon">🔒</span></button>
            </div>
        </main>

        <footer>
            <img src="partial-wheel-of-fortune.png" alt="Wheel of Fortune" class="partial-wheel">
        </footer>
    </div>
</body>
</html>
