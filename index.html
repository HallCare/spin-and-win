<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عجلة الحظ - صالة العناية | Hall Care</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Tajawal:wght@500;800&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #f5e4d3; --primary-color: #8c6239; --accent-color: #b07d53; --input-bg: #fffbf7; --insta-color: #d62976; }
        body { margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; background-color: var(--bg-color); display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        .container { text-align: center; max-width: 480px; width: 90%; padding: 30px 25px; background: rgba(255, 255, 255, 0.15); border-radius: 24px; backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.35); box-shadow: 0 20px 45px rgba(140, 98, 57, 0.06); }
        .logo { width: 100%; max-width: 160px; margin: 0 auto 20px auto; display: block; }
        h1 { color: var(--primary-color); font-size: 20px; font-weight: 800; margin-bottom: 25px; }
        .form-group { margin-bottom: 16px; width: 85%; margin-left: auto; margin-right: auto; }
        .form-group input { width: 100%; padding: 15px; border: 1.5px solid rgba(140, 98, 57, 0.18); border-radius: 16px; background-color: var(--input-bg); text-align: center; font-weight: bold; color: var(--primary-color); outline: none; }
        .btn-main { background-color: var(--accent-color); color: white; border: none; padding: 15px 45px; font-size: 17px; border-radius: 30px; cursor: pointer; width: 85%; margin-top: 10px; font-weight: bold; }
        .btn-insta { background-color: var(--insta-color); color: white; padding: 14px 35px; border-radius: 30px; display: inline-flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; width: 85%; margin-bottom: 15px; font-weight: bold; }
        .screen { display: none; }
        .active-screen { display: block; }
        .wheel-outer-wrapper { position: relative; margin: 20px auto; width: 300px; height: 300px; border: 5px solid var(--primary-color); border-radius: 50%; overflow: hidden; }
        #wheelCanvas { width: 100%; height: 100%; transition: transform 5s cubic-bezier(0.1, 0.8, 0.1, 1); }
    </style>
</head>
<body>

    <div class="container">
        <img src="Hallcare.png" class="logo" onerror="this.src='logo.png'">

        <div id="screen1" class="screen active-screen">
            <h1>مرحباً بك في سحب صالة العناية</h1>
            <div class="form-group"><input type="text" id="userName" placeholder="الاسم الكريم"></div>
            <div class="form-group"><input type="tel" id="userPhone" placeholder="رقم الجوال"></div>
            <button class="btn-main" onclick="navigateToScreen2()">التالي</button>
        </div>

        <div id="screen2" class="screen">
            <h1>تابعنا على حساباتنا</h1>
            <a href="https://linktr.ee/HALLCARE" target="_blank" class="btn-insta">🔗 تابعنا على إنستغرام</a>
            <button class="btn-main" onclick="navigateToScreen3()">إبدأ اللعب الآن</button>
        </div>

        <div id="screen3" class="screen">
            <h1>أدر العجلة وحظاً موفقاً!</h1>
            <div class="wheel-outer-wrapper"><canvas id="wheelCanvas" width="400" height="400"></canvas></div>
            <div id="resultOutput" style="font-weight:bold; color:var(--primary-color);"></div>
            <button id="spinActionBtn" class="btn-main" onclick="startSpinAction()">أدر العجلة الآن</button>
        </div>
    </div>

    <script>
        let userData = {};
        const prizesList = ['خصم ٢٠٪', 'تقسيمة ١٠ مللي', 'خصم ٥٪', 'دهن مسك مجاني', 'خصم ١٠٪', 'حظ أوفر', 'خصم ١٥٪', 'تقسيمة ٦ مللي'];

        function navigateToScreen2() {
            userData = { name: document.getElementById('userName').value };
            document.getElementById('screen1').classList.remove('active-screen');
            document.getElementById('screen2').classList.add('active-screen');
        }

        function navigateToScreen3() {
            document.getElementById('screen2').classList.remove('active-screen');
            document.getElementById('screen3').classList.add('active-screen');
            drawWheel();
        }

        function drawWheel() {
            const canvas = document.getElementById('wheelCanvas');
            const ctx = canvas.getContext('2d');
            const sections = prizesList.length;
            const arc = (2 * Math.PI) / sections;
            for (let i = 0; i < sections; i++) {
                ctx.beginPath();
                ctx.moveTo(200, 200);
                ctx.arc(200, 200, 200, i * arc, (i + 1) * arc);
                ctx.fillStyle = (i % 2 === 0) ? '#b07d53' : '#d9b48f';
                ctx.fill();
            }
        }

        function startSpinAction() {
            const canvas = document.getElementById('wheelCanvas');
            const luckyIndex = Math.floor(Math.random() * prizesList.length);
            const rotation = (360 * 5) + (luckyIndex * (360 / prizesList.length));
            canvas.style.transform = `rotate(${rotation}deg)`;
            setTimeout(() => {
                document.getElementById('resultOutput').innerHTML = `تهانينا ${userData.name}! ربحت: ${prizesList[luckyIndex]}`;
            }, 5000);
        }
    </script>
</body>
</html>
