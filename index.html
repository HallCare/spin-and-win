<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عجلة الحظ - صالة العناية | Hall Care</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #f5e4d3; --primary-color: #8c6239; --accent-color: #b07d53; }
        body { margin: 0; font-family: 'Tajawal', sans-serif; background-color: var(--bg-color); display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { text-align: center; max-width: 480px; width: 90%; padding: 30px; background: rgba(255, 255, 255, 0.2); border-radius: 24px; backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.3); }
        .logo { width: 150px; margin-bottom: 20px; }
        .btn-main { background-color: var(--accent-color); color: white; border: none; padding: 15px 40px; border-radius: 30px; cursor: pointer; font-weight: bold; width: 85%; margin-top: 15px; }
        .btn-main:disabled { background-color: #a0a0a0; cursor: not-allowed; }
        .screen { display: none; }
        .active-screen { display: block; }
        .wheel-canvas-container { width: 320px; height: 320px; margin: 20px auto; border-radius: 50%; border: 8px solid var(--primary-color); overflow: hidden; }
        #wheelCanvas { width: 100%; height: 100%; transition: transform 5s cubic-bezier(0.1, 0.8, 0.1, 1); }
        .result-message { font-size: 18px; font-weight: bold; color: var(--primary-color); margin: 15px 0; }
    </style>
</head>
<body>

    <div class="container">
        <img src="Hallcare.png" alt="Logo" class="logo">

        <div id="screen1" class="screen active-screen">
            <h1>مرحباً بك في سحب صالة العناية</h1>
            <input type="text" id="userName" placeholder="الاسم الكريم" style="width: 80%; padding: 12px; border-radius: 10px; border: none; margin-bottom: 10px;"><br>
            <button class="btn-main" onclick="navigateToScreen2()">التالي</button>
        </div>

        <div id="screen2" class="screen">
            <h1>تابعنا على حساباتنا للمزيد</h1>
            <button class="btn-main" onclick="navigateToScreen3()">إبدأ اللعب الآن</button>
        </div>

        <div id="screen3" class="screen">
            <h1>أدر العجلة وحظاً موفقاً!</h1>
            <div class="wheel-canvas-container">
                <canvas id="wheelCanvas" width="400" height="400"></canvas>
            </div>
            <div id="resultOutput" class="result-message"></div>
            <button id="spinActionBtn" class="btn-main" onclick="startSpinAction()">أدر العجلة الآن</button>
        </div>
    </div>

    <script>
        const prizesList = ['خصم ٢٠٪', 'تقسيمة ١٠ مللي', 'خصم ٥٪', 'مسك مجاني', 'خصم ١٠٪', 'حظ أوفر', 'خصم ١٥٪', 'تقسيمة ٦ مللي'];
        let userData = { name: "" };

        function navigateToScreen2() {
            userData.name = document.getElementById('userName').value;
            document.getElementById('screen1').classList.remove('active-screen');
            document.getElementById('screen2').classList.add('active-screen');
        }

        function navigateToScreen3() {
            document.getElementById('screen2').classList.remove('active-screen');
            document.getElementById('screen3').classList.add('active-screen');
            drawWheel();
            checkEligibility();
        }

        function drawWheel() {
            const canvas = document.getElementById('wheelCanvas');
            const ctx = canvas.getContext('2d');
            const center = 200;
            const sliceAngle = (2 * Math.PI) / prizesList.length;

            prizesList.forEach((prize, i) => {
                const angle = i * sliceAngle;
                ctx.fillStyle = (i % 2 === 0) ? '#b07d53' : '#d9b48f';
                ctx.beginPath();
                ctx.moveTo(center, center);
                ctx.arc(center, center, 200, angle, angle + sliceAngle);
                ctx.fill();
                
                ctx.save();
                ctx.translate(center, center);
                ctx.rotate(angle + sliceAngle / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#fff";
                ctx.font = "bold 16px Arial";
                ctx.fillText(prize, 180, 5);
                ctx.restore();
            });
        }

        function checkEligibility() {
            const lastSpin = localStorage.getItem('lastSpinDate');
            if (lastSpin === new Date().toDateString()) {
                startTimer();
            }
        }

        function startSpinAction() {
            const canvas = document.getElementById('wheelCanvas');
            const btn = document.getElementById('spinActionBtn');
            const luckyIndex = Math.floor(Math.random() * prizesList.length);
            const rotation = (360 * 5) + (luckyIndex * (360 / prizesList.length));
            
            canvas.style.transform = `rotate(${rotation}deg)`;
            btn.disabled = true;

            setTimeout(() => {
                document.getElementById('resultOutput').innerHTML = `تهانينا ${userData.name}! ربحت: ${prizesList[luckyIndex]}`;
                localStorage.setItem('lastSpinDate', new Date().toDateString());
                startTimer();
            }, 5000);
        }

        function startTimer() {
            const btn = document.getElementById('spinActionBtn');
            btn.disabled = true;
            const update = () => {
                const now = new Date();
                const tomorrow = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
                const diff = tomorrow - now;
                const h = Math.floor(diff / 3600000);
                const m = Math.floor((diff % 3600000) / 60000);
                const s = Math.floor((diff % 60000) / 1000);
                btn.innerText = `عد إلينا غداً: ${h}:${m}:${s}`;
            };
            setInterval(update, 1000);
            update();
        }
    </script>
</body>
</html>
