<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عجلة الحظ - صالة العناية | Hall Care</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Tajawal:wght@500;800&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f5e4d3;      
            --primary-color: #8c6239; 
            --accent-color: #b07d53;  
            --input-bg: #fffbf7;      
            --insta-color: #d62976;   
        }

        body { margin: 0; padding: 0; font-family: 'Tajawal', 'Cairo', sans-serif; background-color: var(--bg-color); display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }

        .container { text-align: center; max-width: 480px; width: 90%; padding: 30px 25px; background: rgba(255, 255, 255, 0.15); border-radius: 24px; backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.35); z-index: 5; }

        .screen { display: none; }
        .active-screen { display: block; }

        .form-group { margin-bottom: 16px; width: 85%; margin-left: auto; margin-right: auto; }
        .form-group input { width: 100%; padding: 15px; border: 1.5px solid rgba(140, 98, 57, 0.18); border-radius: 16px; background-color: var(--input-bg); text-align: center; }

        .btn-main { background-color: var(--accent-color); color: white; border: none; padding: 15px 45px; border-radius: 30px; cursor: pointer; width: 85%; margin-top: 10px; font-weight: bold; }
        .btn-insta { background-color: var(--insta-color); color: white; padding: 14px 35px; border-radius: 30px; display: inline-flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; width: 85%; box-sizing: border-box; }
        
        #wheelCanvas { width: 100%; height: 100%; transition: transform 5s cubic-bezier(0.1, 0.8, 0.1, 1); }
    </style>
</head>
<body>

    <div class="container">
        <div id="screen1" class="screen active-screen">
            <h1>مرحباً بك في سحب صالة العناية</h1>
            <div class="form-group"><input type="text" id="userName" placeholder="الاسم الكريم"></div>
            <div class="form-group"><input type="tel" id="userPhone" placeholder="رقم الجوال (05xxxxxxxx)"></div>
            <button class="btn-main" onclick="navigateToScreen2()">التالي</button>
        </div>

        <div id="screen2" class="screen">
            <h1>تابعنا على حساباتنا لتفعيل العجلة</h1>
            <a href="https://linktr.ee/HALLCARE?gad_source=1" target="_blank" class="btn-insta" onclick="unlockWheelButton()">افتح الرابط وتابعنا</a>
            <button id="startPlayBtn" class="btn-main" disabled onclick="navigateToScreen3()">إبدأ اللعب الآن</button>
        </div>

        <div id="screen3" class="screen">
            <h1>أدر العجلة وحظاً موفقاً!</h1>
            <canvas id="wheelCanvas" width="400" height="400"></canvas>
            <div id="resultOutput"></div>
            <button id="spinActionBtn" class="btn-main" onclick="startSpinAction()">أدر العجلة الآن</button>
        </div>
    </div>

    <script>
        let userData = {};
        function navigateToScreen2() {
            const name = document.getElementById('userName').value.trim();
            const phone = document.getElementById('userPhone').value.trim();
            if (name === "" || phone === "") { alert('الرجاء تعبئة البيانات'); return; }
            userData = { name, phone };
            document.getElementById('screen1').classList.remove('active-screen');
            document.getElementById('screen2').classList.add('active-screen');
        }

        function unlockWheelButton() { document.getElementById('startPlayBtn').disabled = false; }

        function navigateToScreen3() {
            document.getElementById('screen2').classList.remove('active-screen');
            document.getElementById('screen3').classList.add('active-screen');
        }

        function startSpinAction() {
            const canvas = document.getElementById('wheelCanvas');
            const rotation = Math.floor(Math.random() * 3600) + 360; 
            canvas.style.transform = `rotate(${rotation}deg)`;
        }
    </script>
</body>
</html>
